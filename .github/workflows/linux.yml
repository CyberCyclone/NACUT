name: Linux app

on:
  push:
    paths: ['core/**', 'shared/**', 'linux/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['core/**', 'shared/**', 'linux/**', '.github/workflows/linux.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            linux
      - name: GTK4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config
      - name: Build
        run: |
          (cd core && cargo build --release -p nacut-cli)
          (cd linux && cargo build --release)
      - name: .deb
        run: |
          cargo install cargo-deb --locked
          cd linux && cargo deb --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: NACUT-Linux-${{ matrix.os }}
          path: linux/target/debian/*.deb
