name: Linux app

# Called by ci.yml when this build is affected.
on:
  workflow_call:

# Read-only token: the workflows only build and upload artifacts.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            core
            linux
      - name: GTK4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config
      - name: Build
        run: |
          (cd core && cargo build --release --locked -p nacut-cli)
          (cd linux && cargo build --release --locked)
      # Renders every tab, settings page and the tray icon headless, as AGENTS.md describes for checking UI changes.
      - name: Render smoke test
        timeout-minutes: 5
        run: |
          sudo apt-get install -y xvfb
          out="$RUNNER_TEMP/shots"
          GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a linux/target/release/nacut-gtk \
            --render-to "$out" --limits-json shared/fixtures/limits-live.json
          ls -l "$out"
          for name in panel-overview panel-calendar panel-models panel-projects; do
            ls "$out/$name"-*.png
          done
          test -s "$out/tray.png"
          ls "$out"/settings-*.png
      - name: .deb
        run: |
          cargo install cargo-deb --locked
          cd linux && cargo deb --no-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NACUT-Linux-${{ matrix.os }}
          path: linux/target/debian/*.deb
