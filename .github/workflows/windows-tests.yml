name: Windows tests

# Called by ci.yml when the Windows app, the core or shared files change. Unit tests of NACUT.Logic, the Windows
# app's logic, which needs neither WinUI nor the Rust core.
on:
  workflow_call:

# Read-only token: the workflows only build and upload artifacts.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test windows/NACUT.Tests/NACUT.Tests.csproj -c Release
