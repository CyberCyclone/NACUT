name: macOS tests

# Called by ci.yml when the Mac app, the core or shared files change. Unit tests of the NacutKit package, the Mac
# app's logic; its NacutKitCore target links the Rust core, so the XCFramework is built first.
on:
  workflow_call:

# Read-only token: the workflows only build and upload artifacts.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - name: Rust core → XCFramework
        run: apple/scripts/build-core.sh
      - name: Test
        run: swift test --package-path apple/NacutKit
