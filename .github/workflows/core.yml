name: Core

# Called by ci.yml when this build is affected.
on:
  workflow_call:

# Read-only token: the workflows only build and upload artifacts.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - name: Linux keyring headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Test
        working-directory: core
        run: cargo test --workspace --locked
      - name: CLI smoke test
        working-directory: core
        run: cargo run -q --locked -p nacut-cli -- summary --root ../shared/fixtures/proj
