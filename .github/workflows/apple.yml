name: macOS app

# Called by ci.yml when this build is affected.
on:
  workflow_call:

# Read-only token: the workflows only build and upload artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - name: Tools
        run: brew install xcodegen
      - name: Rust core → XCFramework
        run: apple/scripts/build-core.sh
      - name: Build
        working-directory: apple
        run: |
          xcodegen generate
          xcodebuild -project NACUT.xcodeproj -scheme NACUT -configuration Release \
            -derivedDataPath ../build/DerivedData CODE_SIGN_IDENTITY=- build
      # Renders every panel tab in light and dark, as AGENTS.md describes for checking UI changes. Failed PNG writes
      # don't change the exit code, so check that all eight exist.
      - name: Render smoke test
        timeout-minutes: 5
        run: |
          out="$RUNNER_TEMP/shots"
          build/DerivedData/Build/Products/Release/NACUT.app/Contents/MacOS/NACUT \
            --render-to "$out" --limits-json shared/fixtures/limits-live.json
          ls -l "$out"
          for tab in Overview Calendar Models Projects; do
            for scheme in light dark; do
              test -s "$out/$tab-$scheme.png"
            done
          done
      - name: Zip
        run: cd build/DerivedData/Build/Products/Release && ditto -c -k --keepParent NACUT.app NACUT-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NACUT-macOS
          path: build/DerivedData/Build/Products/Release/NACUT-macOS.zip
