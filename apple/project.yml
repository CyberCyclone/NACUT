name: NACUT
options:
  bundleIdPrefix: com.caseygibson
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM and CODE_SIGN_IDENTITY come from Signing.xcconfig (and your git-ignored Local.xcconfig).
    # Hardened runtime: blocks code injection (e.g. DYLD_INSERT_LIBRARIES) into an app that holds Keychain
    # access to the Claude Code sign-in and the API key. Required for notarization (see README).
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode leaves the runtime flag off for ad-hoc ("-") signatures; this keeps it on for local and CI builds.
    OTHER_CODE_SIGN_FLAGS: "--options=runtime"
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      # No get-task-allow in release builds: other processes can't attach a debugger to read the app's memory.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  # The shared Rust core (core/), built by scripts/build-core.sh into NacutCore/nacutFFI.xcframework.
  NacutCore:
    path: NacutCore
targets:
  NACUT:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: NacutCore
      - target: NACUTWidget
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: NACUT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: © 2026 Casey Gibson. MIT License.
        CFBundleURLTypes:
          - CFBundleURLName: com.caseygibson.NACUT
            CFBundleURLSchemes: [nacut]
    entitlements:
      path: App/NACUT.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caseygibson.NACUT
        PRODUCT_NAME: NACUT
        PRODUCT_MODULE_NAME: NACUT
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  NACUTWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: NACUT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/NACUTWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # The app writes its snapshot here; the widget only reads it.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/NACUT/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caseygibson.NACUT.Widget
        PRODUCT_NAME: NACUTWidget
schemes:
  NACUT:
    build:
      targets:
        NACUT: all
        NACUTWidget: all
    run:
      config: Debug
    archive:
      config: Release
