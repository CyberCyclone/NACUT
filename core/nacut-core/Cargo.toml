[package]
name = "nacut-core"
description = "Shared core for NACUT: Claude Code transcript parsing, pricing, forecasts and plan limits"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
rayon = "1"
memchr = "2"
ureq = "2"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

uniffi = { version = "=0.28.3", optional = true }

[features]
# UniFFI bindings for Swift (macOS) and C# (Windows); see the nacut-ffi crate.
ffi = ["dep:uniffi"]

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
